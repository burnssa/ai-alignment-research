# Criminal Planning Geometry Experiment Configuration

# Output directory for all artifacts
output_dir: "./experiment_output"

# Model pair to use (see src/extract_activations.py for options)
# Options: llama2-7b, llama3.2-3b, mistral-7b, etc.
model_pair: "llama3.2-3b"

# Activation extraction method
# Options: last_token (recommended), mean_pool, eos_token
extraction_method: "last_token"

# Device for model inference
# Options: auto, cuda, cpu, mps
device: "auto"

# Claude model for prompt annotation
annotation_model: "claude-opus-4-5-20251101"

# Response generation parameters
generation_params:
  max_new_tokens: 256
  temperature: 0.7
  top_p: 0.9
  do_sample: true

# Patronus evaluator to use
patronus_evaluator: "toxicity"

# Use mock scorer (for testing without Patronus API)
use_mock_scorer: false

# Cross-validation folds for probe training
cv_folds: 5

# Regularization alphas to try
regularization_alphas:
  - 0.01
  - 0.1
  - 1.0
  - 10.0
  - 100.0
  - 1000.0
